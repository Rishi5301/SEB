name: "CodeQL"

on:
  push:
    branches: [ "master", "*" ]
  pull_request:
    branches: [ "master", "*" ]
  schedule:
    - cron: '0 0 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: "windows-latest"
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'csharp', 'javascript-typescript' ]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v4
      with:
        languages: ${{ matrix.language }}
        queries: security-extended,security-and-quality

    # CodeQL's autobuild cannot auto-detect this .NET Framework solution, so build C# manually.
    - name: Setup MSBuild
      if: matrix.language == 'csharp'
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      if: matrix.language == 'csharp'
      uses: nuget/setup-nuget@v2

    - name: Build solution
      if: matrix.language == 'csharp'
      run: |
        nuget restore SafeExamBrowser.sln
        msbuild SafeExamBrowser.sln /verbosity:minimal /p:Configuration=Release /p:Platform=x64 /p:langversion=latest "/t:SafeExamBrowser_Runtime;SafeExamBrowser_Client;SafeExamBrowser_ResetUtility;SebWindowsConfig"

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v4
      with:
        category: "/language:${{matrix.language}}"
